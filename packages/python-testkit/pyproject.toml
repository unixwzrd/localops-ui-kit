[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "localops-ui-testkit"
version = "0.1.0"
description = "Reusable Playwright geometry checks for local-first operator interfaces"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["playwright>=1.54", "pydantic>=2.11"]

[project.optional-dependencies]
test = ["pytest>=8.4", "pytest-playwright>=0.7", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/localops_ui_testkit/oracle.py" = ["E501"] # Embedded browser script is formatted as JavaScript.

[tool.hatch.build.targets.wheel]
packages = ["src/localops_ui_testkit"]
