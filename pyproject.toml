[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "localops-ui"
version = "0.2.0"
description = "Python-first semantic UI toolkit for WebUI, Textual, and Rich"
readme = "packages/python/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
cli = ["rich>=13.9,<16"]
tui = ["textual>=8,<9"]
all = ["rich>=13.9,<16", "textual>=8,<9"]
test = [
  "build>=1.2",
  "pytest>=8.4",
  "pytest-asyncio>=0.24",
  "pytest-playwright>=0.7",
  "rich>=13.9,<16",
  "ruff>=0.12",
  "textual>=8,<9",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
testpaths = ["packages/python/tests", "packages/python-testkit/tests", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["packages/python/src/localops_ui"]

[tool.hatch.build.targets.wheel.force-include]
"packages/web/static" = "localops_ui/static"

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "packages/python/README.md",
  "packages/python/src/localops_ui",
  "packages/python/tests",
  "packages/web/assets.json",
  "packages/web/static",
  "pyproject.toml",
]
