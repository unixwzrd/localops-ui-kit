name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[all,test]' -e 'packages/python-testkit[test]'
      - run: python -m playwright install --with-deps chromium webkit
      - run: ruff format --check packages/python packages/python-testkit tests scripts
      - run: ruff check packages/python packages/python-testkit tests scripts
      - run: python scripts/validate_assets.py
      - run: python scripts/check_publication.py
      - run: pytest packages/python/tests packages/python-testkit/tests tests --browser chromium --browser webkit
      - run: python scripts/build_showcase.py
      - run: python -m build
      - run: python -m build --outdir packages/python-testkit/dist packages/python-testkit
      - run: python scripts/verify_distribution.py
